name: eda_ceos

# The EOS init config generated by EDA puts the management address on
# Management1 inside the 'management' VRF. Containerlab names the cEOS
# management interface Management0 by default, so eth0 is remapped to
# Management1 with ceos-intf-mapping.json. Once that file is mounted, cEOS only
# creates the interfaces listed in it, so every data interface used in the
# links below must be listed there as well.

topology:
  kinds:
    arista_ceos:
      image: registry.srlinux.dev/pub/ceos:4.36.2F
      binds:
        - ceos-intf-mapping.json:/mnt/flash/EosIntfMapping.json:ro
  nodes:
    leaf1:
      kind: arista_ceos
    leaf2:
      kind: arista_ceos
    spine1:
      kind: arista_ceos

  links:
    - endpoints: ["leaf1:eth1_1", "spine1:eth1_1"]
    - endpoints: ["leaf2:eth1_1", "spine1:eth1_2"]
